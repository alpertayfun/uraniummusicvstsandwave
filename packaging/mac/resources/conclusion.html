<h2>SANDWAVE is installed</h2>
<p>Open your DAW and rescan plug-ins if needed.<br>
In Ableton Live: <i>Settings &rarr; Plug-Ins</i>, enable <i>Use Audio Units</i> / <i>Use VST3 Plug-In System Folders</i>, then <i>Rescan</i>.</p>
<p>The plugin appears under <b>Uranium Music &rarr; Sandwave</b>.</p>
